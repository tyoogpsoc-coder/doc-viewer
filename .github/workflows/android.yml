name: Android APK 빌드 · 테스트

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # flutter_rhwp(한글 엔진)는 Rust로 빌드됨
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - name: 환경 정보
        run: |
          flutter --version
          rustc --version

      - name: Android 플랫폼 폴더 생성
        run: |
          flutter create --platforms=android --org com.example.docviewer --project-name doc_viewer .
          python3 tool/patch_android.py

      - name: 패키지 설치
        run: |
          flutter pub get
          python3 tool/patch_cargokit.py
          python3 tool/gen_fixtures.py

      - name: 정적 분석
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: 단위·위젯 테스트
        run: flutter test

      - name: 릴리스 APK 빌드
        run: flutter build apk --release

      - name: APK 업로드
        uses: actions/upload-artifact@v4
        with:
          name: doc-viewer-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # ---------- 에뮬레이터 통합 테스트 ----------
      - name: KVM 사용 설정
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 에뮬레이터에서 통합 테스트
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart -d emulator-5554 > drive.log 2>&1; s=$?; cat drive.log; exit $s

      - name: 스크린샷 · 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: |
            screenshots/
            drive.log
          if-no-files-found: ignore
